name: CLI binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm ci
      - run: npm run build:binaries
      - name: Package the VS Code extension
        run: |
          npm run package --workspace clementina
          mv packages/vscode-extension/clementina-*.vsix dist/bin/
          (cd dist/bin && sha256sum clementina-*.vsix >> SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: clementina-binaries
          path: dist/bin/
          if-no-files-found: error

  # Each binary runs on its own OS with Node.js removed from PATH.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, binary: clementina-linux-x64}
          - {os: ubuntu-24.04-arm, binary: clementina-linux-arm64}
          - {os: macos-latest, binary: clementina-darwin-arm64}
          - {os: macos-15-intel, binary: clementina-darwin-x64}
          - {os: windows-latest, binary: clementina-windows-x64.exe}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clementina-binaries
          path: bin
      - name: Run CLI commands without Node.js
        run: |
          chmod +x "bin/${{ matrix.binary }}"
          cli="$PWD/bin/${{ matrix.binary }}"
          for _ in 1 2 3 4 5; do
            node_path="$(command -v node)" || break
            export PATH="$(echo "$PATH" | tr ':' '\n' | grep -vxF "$(dirname "$node_path")" | paste -sd: -)"
          done
          if command -v node; then echo "Node.js is still on PATH"; exit 1; fi
          "$cli" --help
          "$cli" --version | tee version.txt
          # A release executable reports the plain version, never a dev build.
          version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' packages/cli/package.json)"
          grep -qx "clementina $version" version.txt
          "$cli" doctor --json
          # The bundled MCP server answers an initialize request over stdio.
          { printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}'; sleep 3; } | "$cli" mcp | tee mcp.txt
          grep -q '"serverInfo"' mcp.txt
          "$cli" project validate examples/minimal-game
          "$cli" asset validate examples/minimal-game/assets/palettes/main.palette.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clementina-binaries
          path: bin
      # A tag with a prerelease suffix (v0.3.0-alpha.1) makes a prerelease.
      - name: Attach binaries and the extension to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
          gh release upload "$GITHUB_REF_NAME" bin/* --repo "$GITHUB_REPOSITORY" --clobber
