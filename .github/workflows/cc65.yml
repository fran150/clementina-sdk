name: cc65

# Builds the cc65 assembler and linker that `clementina install cc65` puts in
# ~/.clementina. cc65 publishes Windows snapshots only, so each platform is
# built here from the upstream release tag on its own runner. Pushing a
# cc65-v<version> tag (cc65-v2.19) attaches the archives and SHA256SUMS to a
# release of that name, which `clementina install cc65` then installs.

on:
  push:
    tags: ['cc65-v*']
  pull_request:
    paths: [.github/workflows/cc65.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The upstream cc65 version built when no cc65-v* tag names one.
  CC65_VERSION: '2.19'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older Ubuntu images keep the glibc requirement low.
          - {os: ubuntu-22.04, target: linux-amd64}
          - {os: ubuntu-22.04-arm, target: linux-arm64}
          - {os: macos-latest, target: darwin-arm64}
          - {os: macos-15-intel, target: darwin-amd64}
          - {os: windows-latest, target: windows-amd64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Choose the version
        run: |
          case "$GITHUB_REF" in refs/tags/cc65-v*) version="${GITHUB_REF_NAME#cc65-v}" ;; *) version="$CC65_VERSION" ;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=cc65-$version-${{ matrix.target }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: cc65/cc65
          ref: V${{ env.VERSION }}
          path: cc65
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: cc65
        # Static linking leaves no MinGW DLLs for the user to find.
        run: make -j4 bin LDFLAGS=-static
      - name: Build
        if: runner.os != 'Windows'
        working-directory: cc65
        run: make -j4 bin
      # ca65 and ld65 find asminc and cfg through CC65_HOME on macOS and Linux,
      # and next to the executable on Windows. On macOS and Linux, bin/ holds
      # small wrappers that set CC65_HOME to this folder and run the real
      # executables from libexec/, so the tools work wherever the folder is
      # unpacked or linked from.
      - name: Package
        run: |
          dir="dist/$PACKAGE_NAME"
          mkdir -p "$dir/bin"
          cp -R cc65/asminc cc65/cfg "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp cc65/bin/* "$dir/bin/"
          else
            mkdir -p "$dir/libexec"
            cp cc65/bin/* "$dir/libexec/"
            for tool in cc65/bin/*; do
              name="$(basename "$tool")"
              cat > "$dir/bin/$name" <<'WRAPPER'
          #!/bin/sh
          # Runs cc65's NAME with CC65_HOME set to this cc65 folder, following links to this script.
          p="$0"
          while [ -L "$p" ]; do
            l="$(readlink "$p")"
            case "$l" in /*) p="$l" ;; *) p="$(dirname "$p")/$l" ;; esac
          done
          root="$(cd "$(dirname "$p")/.." && pwd)"
          CC65_HOME="$root" exec "$root/libexec/NAME" "$@"
          WRAPPER
              sed -i.bak "s/NAME/$name/g" "$dir/bin/$name" && rm "$dir/bin/$name.bak"
              chmod 755 "$dir/bin/$name"
            done
          fi
          cp cc65/LICENSE "$dir/LICENSE"
          printf 'cc65 %s, built from https://github.com/cc65/cc65/tree/V%s for the Clementina SDK.\n' "$VERSION" "$VERSION" > "$dir/README.txt"
          ls -l "$dir/bin"
      - name: Smoke test
        run: |
          bin="$PWD/dist/$PACKAGE_NAME/bin"
          # The build bakes the source folder's asminc path into ca65; move the
          # source away so the test sees only what the package provides.
          mv cc65 cc65-source
          cd "$RUNNER_TEMP"
          # A .macpack loads its macros from asminc, as the Clementina library's do.
          printf '.macpack longbranch\n.segment "CODE"\n  lda #$01\n  rts\n' > smoke.s
          printf 'MEMORY { RAM: start = $1000, size = $1000, file = %%O; }\nSEGMENTS { CODE: load = RAM, type = ro; }\n' > smoke.cfg
          "$bin/ca65" --version
          "$bin/ca65" --cpu 65C02 -o smoke.o smoke.s
          "$bin/ld65" --config smoke.cfg -o smoke.bin smoke.o
          "$bin/ar65" r smoke.lib smoke.o
          # A link to the wrapper, as ~/.clementina/bin holds, still finds asminc.
          if [ "$RUNNER_OS" != Windows ]; then
            mkdir -p links && ln -sf "$bin/ca65" links/ca65
            links/ca65 --cpu 65C02 -o linked.o smoke.s
          fi
          test "$(od -An -tx1 smoke.bin | tr -d ' \n')" = a90160
      - name: Archive
        run: |
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$PACKAGE_NAME.zip" "$PACKAGE_NAME" >/dev/null
          else
            tar -czf "$PACKAGE_NAME.tar.gz" "$PACKAGE_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cc65-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/cc65-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cc65-*
          path: dist
          merge-multiple: true
      - name: Attach the archives to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "cc65 ${GITHUB_REF_NAME#cc65-v}" \
                 --notes "cc65 ${GITHUB_REF_NAME#cc65-v} built for clementina install. Not an SDK release." --prerelease
          gh release upload "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --clobber
          # Deleting a tag turns its release into a draft; publish it again when the tag is pushed back.
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
