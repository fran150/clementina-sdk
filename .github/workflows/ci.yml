name: SDK CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ca65 toolchain
        run: sudo apt-get update && sudo apt-get install -y cc65
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:packages
