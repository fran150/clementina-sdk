name: Emulator integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: clementina-sdk
      - uses: actions/checkout@v4
        with:
          repository: fran150/clementina-6502
          path: clementina-6502
          token: ${{ secrets.CLEMENTINA_COMPANION_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: fran150/clementina-video-client
          path: clementina-video-client
          token: ${{ secrets.CLEMENTINA_COMPANION_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clementina-sdk/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cc65 libasound2-dev
      - name: Build emulator automation
        run: go build -o "$RUNNER_TEMP/clementina-automation" ./cmd/clementina-automation
        working-directory: clementina-6502
      - name: Build native renderer
        run: go build -o "$RUNNER_TEMP/clementina-render" ./cmd/clementina-render
        working-directory: clementina-video-client
      - run: npm ci
        working-directory: clementina-sdk
      - run: npm run build
        working-directory: clementina-sdk
      - name: Emulator and runtime integration
        run: |
          node scripts/test-emulator-integration.mjs "$RUNNER_TEMP/clementina-automation" "$RUNNER_TEMP/clementina-render"
          node scripts/test-runtime-integration.mjs "$RUNNER_TEMP/clementina-automation" "$RUNNER_TEMP/clementina-render"
          CLEMENTINA_EMULATOR="$RUNNER_TEMP/clementina-automation" node --test tests/mcp.test.mjs
        working-directory: clementina-sdk
