format: clementina-project
version: 1
name: Catch the Star
target:
  machine: clementina-6502
program:
  entry: src/main.bas
assets:
  palettes:
    - assets/palettes/main.palette.json
  paletteConfigs:
    - assets/palette-configs/main.palette-config.json
  tilesets: []
  backgrounds: []
  overlays: []
  shapes: []
  animations: []
build:
  outputDirectory: build
  basic:
    outputName: game
    memoryTop: 28672 # $7000: BASIC stays below the assembly code
  assembly:
    sources:
      - src/score.s
    linkerConfig: link.cfg
    outputName: code
    loadAddress: 28672 # $7000
    entrySymbol: add_point
  video:
    paletteConfigId: palette-config:main
